<div class="container" data-aos="fade-up">
    <h2 class="section-title">Contact</h2>

    <div class="contact-grid">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="card">
            <div class="field">
                <label for="name">Name</label>
                <input id="name" type="text" formControlName="name"/>
                <small *ngIf="submitted && f['name'].errors" class="error">
                    Name is required.
                </small>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email"/>
                <small *ngIf="submitted && f['email'].errors" class="error">
                    Valid email is required.
                </small>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" rows="4" formControlName="message" placeholder="How can I help?"></textarea>
                <small *ngIf="submitted && f['message'].errors" class="error">
                    Message must be at least 10 characters.
                </small>
            </div>

            <button type="submit" class="btn">
                Send Message 
                <i class="fa-regular fa-paper-plane"></i>
            </button>

            <p *ngIf="successMessage" class="success">
                {{ successMessage }}
            </p>
        </form>

        <div class="side card">
            <h3>Get in Touch</h3>
            <p>
                Feel free to reach out for collaborations or just a friendly hello!
            </p>
            <ul class="socials">
                <li>
                    <a href="https://github.com/PaulMbutu" target="_blank">
                        <i class="fa-brands fa-github"></i> GitHub
                    </a>
                </li>
                <li>
                    <a href="https://www.linkedin.com/in/paul-mutisya-89713a23a/" target="_blank">
                        <i class="fa-brands fa-linkedin"></i> LinkedIn
                    </a>
                </li>
                <li>
                    <a href="mailto:pmbutum24@gmail.com">
                        <i class="fa-regular fa-envelope"></i> Email
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
